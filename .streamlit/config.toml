# Surface and ink match the validated chart palette in dashboard/theme.py, so figures never
# disagree with the page they sit on. primaryColor is categorical slot 1 (petrol).
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
font = "sans-serif"

[server]
headless = true

[browser]
gatherUsageStats = false
