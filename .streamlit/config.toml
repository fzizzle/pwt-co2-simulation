# Keynote Darkroom, matching pwt/deck/art.py and dashboard/theme.py. Dark for every viewer
# (owner decision, 27 Nov 2026): there is no [theme.light], so Streamlit never follows a
# light system setting. primaryColor is neutral silver so no control looks like a powertrain;
# filled controls carry black ink on it (13.9:1).
[theme]
base = "dark"
primaryColor = "#d1d1d6"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1c1c1e"
textColor = "#f5f5f7"
borderColor = "#2c2c2e"
linkColor = "#6eb4fa"
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
chartCategoricalColors = ["#d09539", "#4fb267", "#b677d5", "#3984d0"]

[theme.dark]
primaryColor = "#d1d1d6"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1c1c1e"
textColor = "#f5f5f7"
borderColor = "#2c2c2e"
linkColor = "#6eb4fa"
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
dataframeBorderColor = "#2c2c2e"
dataframeHeaderBackgroundColor = "#1c1c1e"
dataframeHeaderTextColor = "#f5f5f7"
chartCategoricalColors = ["#d09539", "#4fb267", "#b677d5", "#3984d0"]

[theme.dark.sidebar]
backgroundColor = "#0a0a0c"
secondaryBackgroundColor = "#1c1c1e"
borderColor = "#2c2c2e"


[server]
headless = true

[browser]
gatherUsageStats = false
