# Surface and ink match the validated dark palette in dashboard/theme.py, so figures never
# disagree with the page they sit on. primaryColor is the dark step of categorical slot 1.
[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#242422"
textColor = "#ffffff"
font = "sans-serif"

[server]
headless = true

[browser]
gatherUsageStats = false
